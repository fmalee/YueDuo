<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>悦读</title>
    <!-- 首帧主题引导：同步外链脚本（CSP script-src 'self' 放行），先于样式与应用执行 -->
    <script src="/bootstrap-theme.js"></script>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; font-src 'self'"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
