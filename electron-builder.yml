appId: com.electron.app
productName: yueduo
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 非运行文件：开发态 userData（Chromium 缓存就占 98M）、测试书、方案文档与 TS 源码
  # （主进程/共享代码已由 electron-vite 编译进 out/，运行时不读原文件）
  - '!.dev/**'
  - '!.trae/**'
  - '!2026-11-17/**'
  - '!AGENTS.md'
  - '!scripts/**'
  - '!electron/**'
  - '!shared/**'
  - '!public/test/**'
  - '!out/renderer/test/**'
  # renderer 已由 Vite 打进 out/renderer，这些包主进程不 require，整包不打
  - '!node_modules/monaco-editor/**'
  - '!node_modules/{dompurify,marked,pinia}/**'
  # 原生模块只带本平台预编译产物：sqlite3 源码（deps/src）与其它平台 prebuild 不进包
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/prebuilds/{darwin-arm64,linux-arm64,linux-x64,linuxmusl-arm64,linuxmusl-x64,win32-arm64,win32-x64}.node'
asarUnpack:
  - resources/**
# Electron 自带语言包只保留中英，Framework 里其余 .lproj（约 17M）打包时剔除
electronLanguages:
  - en
  - zh_CN
win:
  executableName: yueduo
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # 图标沿用 NovelManager 那版书本图标（含 1024@2x），Dock/Finder 都读这里
  icon: build/icon.icns
  # 只保证本机运行：显式 ad-hoc 签名，不依赖开发者证书、不做公证。
  # ad-hoc 与 hardenedRuntime 同开会触发库校验，这里关掉硬化运行时（本机运行不启用加固即可）。
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Finder 注释同步要经 osascript 控制 Finder，缺少此说明时系统不会弹自动化授权
    NSAppleEventsUsageDescription: 同步 Finder 注释需要控制 Finder 刷新一次索引。
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
